<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>FURNITURA | Luxury Modern Furniture & Designer Living</title>
    <meta name="title" content="FURNITURA | Luxury Modern Furniture & Designer Living" />
    <meta name="description" content="Discover timeless furniture designs, luxury velvet sofas, modern dining sets, and ergonomic office furniture. Experience our interactive 3D studio and free delivery on orders over $999." />
    <meta name="keywords" content="luxury furniture, modern sofa, dining room furniture, bedroom sets, velvet chairs, 3D furniture viewer, designer living, furnitura" />
    <meta name="author" content="FURNITURA Luxury Living" />
    <meta name="theme-color" content="#3b184f" />
    <link rel="canonical" href="https://furnitura-luxury.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://furnitura-luxury.com/" />
    <meta property="og:title" content="FURNITURA | Luxury Modern Furniture & Designer Living" />
    <meta property="og:description" content="Explore handcrafted furniture, custom velvet textures, and interactive 3D product previews. Transform your living space." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://furnitura-luxury.com/" />
    <meta property="twitter:title" content="FURNITURA | Luxury Modern Furniture" />
    <meta property="twitter:description" content="Discover timeless furniture designs, unmatched comfort, and real-time 3D furniture preview." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=1200&q=80" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "FurnitureStore",
          "@id": "https://furnitura-luxury.com/#organization",
          "name": "FURNITURA",
          "url": "https://furnitura-luxury.com/",
          "logo": "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=300&q=80",
          "description": "National and international standard luxury modern furniture store.",
          "priceRange": "$$$",
          "telephone": "+250-788-000-111",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "KG 7 Ave, Heights Luxury Plaza",
            "addressLocality": "Kigali",
            "addressCountry": "RW"
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
              "opens": "08:00",
              "closes": "20:00"
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://furnitura-luxury.com/#website",
          "url": "https://furnitura-luxury.com/",
          "name": "FURNITURA Furniture Store",
          "publisher": {
            "@id": "https://furnitura-luxury.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://furnitura-luxury.com/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
